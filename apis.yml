aid: shipwell
url: https://raw.githubusercontent.com/api-evangelist/shipwell/refs/heads/main/apis.yml
name: Shipwell
kind: company
description: >-
  Shipwell is an AI-powered transportation management system (TMS) and freight
  execution platform for shippers, brokers, and carriers. The Shipwell v2 Core
  API lets developers plan, rate, tender, book, track, and settle multimodal
  freight - parcel, LTL, truckload, intermodal, rail, and ocean - programmatically.
  It covers shipments, quoting and rating, carrier management, purchase orders
  and orders, documents, tenders, freight pay and audit, and a real-time events
  and webhooks surface. The production base URL is https://api.shipwell.com/v2
  (the newer Orders API is served under https://api.shipwell.com without the /v2
  prefix), with a fully separate sandbox at https://sandbox-api.shipwell.com/v2.
  Requests are authenticated with company-scoped API keys passed in the
  Authorization header. Access to the full platform and API is enterprise and
  contract-gated.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Transportation Management
- TMS
- Freight
- Logistics
- Shipping
- Supply Chain
created: '2026-07-05'
modified: '2026-07-05'
specificationVersion: '0.19'
apis:
- aid: shipwell:shipwell-shipments-api
  name: Shipwell Shipments API
  tags:
  - Shipments
  - Freight
  - Multimodal
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.shipwell.com/docs/shipments/create-your-first-shipment/
  baseURL: https://api.shipwell.com/v2
  properties:
  - url: https://docs.shipwell.com/docs/shipments/create-your-first-shipment/
    type: Documentation
  - url: https://docs.shipwell.com/openapi_pages/backend-core/tag/shipments/
    type: APIReference
  - url: openapi/shipwell-openapi.yml
    type: OpenAPI
  - url: collections/shipwell.postman_collection.json
    type: PostmanCollection
  - url: collections/shipwell.opencollection.json
    type: OpenCollection
  description: >-
    Create, list, retrieve, and update multimodal freight shipments with stops,
    line items, equipment, service levels, notes, and carrier assignments. The
    central resource of the Shipwell platform, covering parcel, LTL, truckload,
    intermodal, rail, and ocean movements.
- aid: shipwell:shipwell-quoting-api
  name: Shipwell Quoting and Rating API
  tags:
  - Quotes
  - Rates
  - RFQ
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.shipwell.com/openapi_pages/backend-core/overview/
  baseURL: https://api.shipwell.com/v2
  properties:
  - url: https://docs.shipwell.com/openapi_pages/backend-core/overview/
    type: Documentation
  - url: https://docs.shipwell.com/openapi_pages/backend-core/tag/quoting/
    type: APIReference
  - url: openapi/shipwell-openapi.yml
    type: OpenAPI
  - url: collections/shipwell.postman_collection.json
    type: PostmanCollection
  - url: collections/shipwell.opencollection.json
    type: OpenCollection
  description: >-
    Request rates and quotes for shipments, run requests for quote (RFQs) against
    carriers, and manage spot negotiations and carrier bids. Endpoint shapes are
    modeled from the documented quoting, spot-negotiations, and carrier-bids
    resource groups; confirm exact request and response schemas against the live
    reference and your account.
- aid: shipwell:shipwell-carriers-api
  name: Shipwell Carriers API
  tags:
  - Carriers
  - Relationships
  - Compliance
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.shipwell.com/openapi_pages/backend-core/overview/
  baseURL: https://api.shipwell.com/v2
  properties:
  - url: https://docs.shipwell.com/openapi_pages/backend-core/overview/
    type: Documentation
  - url: https://docs.shipwell.com/openapi_pages/backend-core/tag/carriers/
    type: APIReference
  - url: openapi/shipwell-openapi.yml
    type: OpenAPI
  - url: collections/shipwell.postman_collection.json
    type: PostmanCollection
  - url: collections/shipwell.opencollection.json
    type: OpenCollection
  description: >-
    List and manage carriers and carrier relationships in your network, including
    compliance and performance master data, carrier tags, and the carrier
    assignments attached to shipments. Endpoint shapes are modeled from the
    documented carriers, carrier-relationships, and carrier-tags groups.
- aid: shipwell:shipwell-orders-api
  name: Shipwell Orders API
  tags:
  - Orders
  - Purchase Orders
  - Fulfillment
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.shipwell.com/docs/orders/orders-legacy-v2/
  baseURL: https://api.shipwell.com
  properties:
  - url: https://docs.shipwell.com/docs/orders/orders-legacy-v2/
    type: Documentation
  - url: https://docs.shipwell.com/openapi_pages/backend-core/overview/
    type: APIReference
  - url: openapi/shipwell-openapi.yml
    type: OpenAPI
  - url: collections/shipwell.postman_collection.json
    type: PostmanCollection
  - url: collections/shipwell.opencollection.json
    type: OpenCollection
  description: >-
    Create and manage orders and purchase orders, then consolidate them onto
    shipments for execution. The newer Orders API is served under
    https://api.shipwell.com without the /v2 prefix (for example
    https://api.shipwell.com/orders), while purchase orders remain under the v2
    Core API. Order endpoint shapes are honestly modeled from the documented
    orders and purchase-orders groups.
- aid: shipwell:shipwell-events-webhooks-api
  name: Shipwell Events and Webhooks API
  tags:
  - Events
  - Webhooks
  - Tracking
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.shipwell.com/docs/webhook/what-are-webhooks/
  baseURL: https://api.shipwell.com/v2
  properties:
  - url: https://docs.shipwell.com/docs/webhook/what-are-webhooks/
    type: Documentation
  - url: https://docs.shipwell.com/openapi_pages/events-and-webhooks/overview/
    type: APIReference
  - url: openapi/shipwell-openapi.yml
    type: OpenAPI
  - url: collections/shipwell.postman_collection.json
    type: PostmanCollection
  - url: collections/shipwell.opencollection.json
    type: OpenCollection
  description: >-
    Retrieve real-time supply-chain events (including shipment tracking timeline
    updates like in_transit and delivered) and register webhook subscriptions
    that Shipwell delivers by HTTP POST to your endpoint. Delivery is
    server-to-endpoint webhooks over HTTPS, not a WebSocket stream.
