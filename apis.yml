aid: shipwell
url: https://raw.githubusercontent.com/api-evangelist/shipwell/refs/heads/main/apis.yml
name: Shipwell
kind: company
description: >-
  Shipwell is an AI-powered transportation management system (TMS) and freight
  execution platform for shippers, brokers, and carriers. The Shipwell v2 Core
  API lets developers plan, rate, tender, book, track, and settle multimodal
  freight - parcel, LTL, truckload, intermodal, rail, and ocean - programmatically.
  It covers shipments, quoting and rating, carrier management, purchase orders
  and orders, documents, tenders, freight pay and audit, and a real-time events
  and webhooks surface. The production base URL is https://api.shipwell.com/v2
  (the newer Orders API is served under https://api.shipwell.com without the /v2
  prefix), with a fully separate sandbox at https://sandbox-api.shipwell.com/v2.
  Requests are authenticated with company-scoped API keys passed in the
  Authorization header. Access to the full platform and API is enterprise and
  contract-gated.
