meters:
- name: platform_subscription
  description: Annual platform subscription scoped to freight volume and activated modules.
  unit: contract
  aggregation: sum
  dimensions:
  - account
  - modules
- name: freight_volume
  description: Freight volume (shipments / loads) executed through the platform, a common contract sizing dimension.
  unit: shipments
  aggregation: sum
  dimensions:
  - account
  - mode
- name: integrations
  description: Custom integrations and professional-services engagements.
  unit: engagements
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track freight volume and executed shipments by mode to understand what drives contract sizing.
- name: Allocation
  description: Map shipments and modules to internal business units and freight lanes for cost allocation.
- name: Optimization
  description: Consolidate orders onto shipments, automate tendering and freight audit, and use quoting to select cost-effective carriers.
- name: Accountability
  description: Assign owners for module usage and integration scope; review annual contract sizing against actual freight volume.
