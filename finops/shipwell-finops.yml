description: >-
  FinOps view of Shipwell spend. Shipwell is an enterprise transportation
  management platform billed under a negotiated annual (or multi-year) contract
  scoped to freight volume, activated modules, and integrations - not a public,
  usage-metered API product. The API and webhooks are included with the platform
  subscription. The dominant cost drivers are the platform subscription and any
  professional-services or integration work, rather than per-request API charges.
notes: >-
  Shipwell does not publish per-unit API rates; there is no public metered API
  line item to reconcile. Cost mapping below is structural - align meters to your
  Shipwell contract's volume and module dimensions during reconciliation.
